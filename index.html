<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Feliz Cumpleaños! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #D4A853;
    --cream: #FDF6EC;
    --rose: #C96A6A;
    --deep: #1A0F0A;
    --soft: #F5E8D0;
  }

  body {
    min-height: 100vh;
    background: var(--deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Partículas de fondo */
  .bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: float linear infinite;
  }

  @keyframes float {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  /* Tarjeta principal */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 3.5rem 4rem;
    max-width: 560px;
    width: 90%;
    border: 1px solid rgba(212,168,83,0.3);
    background: rgba(253,246,236,0.04);
    backdrop-filter: blur(6px);
    border-radius: 4px;
    animation: appear 1s ease both;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ornament {
    color: var(--gold);
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    opacity: 0.6;
    animation: appear 1s 0.2s ease both;
  }

  .cake {
    font-size: 5rem;
    margin: 1.5rem 0 1rem;
    display: block;
    animation: bounce 2.5s 1.2s ease-in-out infinite, appear 0.8s 0.4s ease both;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 700;
    color: var(--gold);
    line-height: 1.1;
    margin-bottom: 0.5rem;
    animation: appear 0.8s 0.6s ease both;
  }

  .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(253,246,236,0.55);
    margin-bottom: 2rem;
    animation: appear 0.8s 0.8s ease both;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.5rem 0;
    animation: appear 0.8s 1s ease both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(212,168,83,0.4));
  }
  .divider::after { background: linear-gradient(to left, transparent, rgba(212,168,83,0.4)); }
  .divider span { color: var(--gold); font-size: 1rem; opacity: 0.7; }

  .message {
    font-size: 1.05rem;
    color: rgba(253,246,236,0.75);
    line-height: 1.9;
    font-weight: 300;
    animation: appear 0.8s 1.1s ease both;
  }

  .name {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--rose);
    margin: 1.2rem 0 0;
    animation: appear 0.8s 1.3s ease both;
  }

  .bottom-ornament {
    margin-top: 2rem;
    color: var(--gold);
    opacity: 0.4;
    font-size: 1.2rem;
    letter-spacing: 0.4em;
    animation: appear 0.8s 1.5s ease both;
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="card">
  <div class="ornament">✦ ✦ ✦</div>
  <span class="cake">🎂</span>
  <h1>¡Feliz Cumpleaños!</h1>
  <p class="subtitle">en tu día especial</p>

  <div class="divider"><span>🌟</span></div>

  <p class="message">
    Que este nuevo año de vida esté lleno<br>
    de alegría, amor y todos los sueños<br>
    que mereces ver cumplidos.
  </p>

  <div class="name">Con mucho cariño ♡</div>

  <div class="bottom-ornament">✦ ✦ ✦</div>
</div>

<script>
  const bg = document.getElementById('bg');
  const colors = ['#D4A853','#C96A6A','#F5E8D0','#E8C4A0','#FFD700'];
  const symbols = ['●','★','✦','♡','✿','◆'];

  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    const size = Math.random() * 10 + 4;
    const color = colors[Math.floor(Math.random() * colors.length)];
    el.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      background: ${color};
      animation-duration: ${Math.random() * 12 + 8}s;
      animation-delay: ${Math.random() * 8}s;
    `;
    if (Math.random() > 0.6) {
      el.style.borderRadius = '0';
      el.style.background = 'transparent';
      el.style.color = color;
      el.style.fontSize = size + 'px';
      el.style.width = 'auto';
      el.style.height = 'auto';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    }
    bg.appendChild(el);
  }
</script>
</body>
</html>
